name: Feature Request
description: Suggest a new feature or improvement for SycoMetrix
title: "Feature Request: [Your Feature Title Here]"
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the Feature Request
      description: Please provide a detailed description of the feature you are requesting, including its purpose
      placeholder: "I would like to request..."
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Describe the Use Case
      description: Please provide a detailed description of the use case for the feature you are requesting.
      placeholder: "I want this because it will..."
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional Information
      description: Please provide any additional information that may be helpful in understanding your feature request.
    validations:
      required: false